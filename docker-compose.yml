version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncnote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncnote}
      POSTGRES_USER: ${POSTGRES_USER:-syncnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncnote}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - syncnote-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syncnote} -d $${POSTGRES_DB:-syncnote}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  syncnote-postgres-data:
    name: syncnote-postgres-data
